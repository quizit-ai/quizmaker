<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--text:#1f1d1a;--muted:#6b665e;--line:#e4dfd6;--accent:#c4562b;--accent-t:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#171614;--card:#222120;--text:#f1eee8;--muted:#a39d92;--line:#37352f;--accent:#e07a4f;--accent-t:#1a1a1a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font:16px/1.5 Georgia,serif;padding:24px}
.wrap{text-align:center;max-width:520px}
h1{font-size:38px;margin:0 0 8px}
p{color:var(--muted);font-family:system-ui,sans-serif;margin:0 0 28px}
.btn{display:inline-block;background:var(--accent);color:var(--accent-t);text-decoration:none;font:600 18px system-ui,sans-serif;padding:14px 32px;border-radius:10px}
.btn:hover{opacity:.9}
.beta{position:fixed;top:0;left:0;right:0;z-index:100;background:#f5c542;color:#2b2200;text-align:center;font:600 13px/1.3 system-ui,sans-serif;padding:8px 12px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.beta b{background:#2b2200;color:#f5c542;border-radius:4px;padding:1px 6px;margin-right:6px;letter-spacing:.5px}
html body{padding-top:58px}
</style>
</head>
<body>
<div class="beta" role="note"><b>BETA</b>This app is for beta testing only. Features may change and some things may not work as expected.</div>
<div class="wrap">
  <h1>Welcome</h1>
  <p>Turn any PDF, Word document or audio recording into a quiz in English or Roman Urdu.</p>
  <a class="btn" href="/quiz">Quiz Maker</a>
  <p style="margin:36px 0 0;font-size:13px"><a href="/admin" style="color:var(--muted)">Admin</a></p>
</div>
</body>
</html>
